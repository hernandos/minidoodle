services:
  postgres:
    image: postgres:16-alpine
    container_name: minidoodle-postgres
    environment:
      POSTGRES_DB: minidoodle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d minidoodle" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - minidoodle-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: minidoodle-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/minidoodle
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - minidoodle-network

volumes:
  postgres_data:

networks:
  minidoodle-network:
    driver: bridge
