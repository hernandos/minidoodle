name: Java CI with Gradle

on:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write        # Required to publish the test results to the PR
  pull-requests: write # Required to post test summaries to the PR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run Tests with Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          arguments: test # Runs tests and generates XML report files

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always() # Ensures the report runs even if tests fail
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true
          include_passed: true
