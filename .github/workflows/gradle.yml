name: Java CI with Gradle

on:
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write        # Required to publish the test results to the PR
  pull-requests: write # Required to post test summaries to the PR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests with Gradle
        run: ./gradlew test # This is the correct way to execute gradle commands in v4

      - name: Run Serenity BDD Tests
        run: ./gradlew :serenity:test :serenity:aggregate

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always() # Ensures the report runs even if tests fail
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true
          include_passed: true

      - name: Upload Serenity Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serenity-bdd-report
          path: serenity/target/site/serenity/
          retention-days: 14

